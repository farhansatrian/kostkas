# =============================================================================
# KostKas — Contoh Konfigurasi Nginx Reverse Proxy (nginx.conf)
# =============================================================================
# Jika VM kost menggunakan Nginx tradisional dan Certbot / Let's Encrypt.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Sembunyikan versi Nginx untuk keamanan

    # Kompresi Gzip untuk efisiensi bandwidth VM
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 1. Redirect seluruh HTTP ke HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name kas.namakost.com;

        # Endpoint verifikasi Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Server HTTPS Utama
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name kas.namakost.com;

        # Path sertifikat TLS (dikelola oleh Certbot / ACME)
        ssl_certificate /etc/letsencrypt/live/kas.namakost.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kas.namakost.com/privkey.pem;

        # Protokol & Chiper TLS Modern
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 10M;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            # Header penting untuk Next.js App Router & Server Actions
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }
    }
}

