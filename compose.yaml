services:
  db:
    image: postgres:17-alpine
    container_name: kostkas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diatur di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diatur di .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diatur di .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kostkas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  kostkas_pgdata:

